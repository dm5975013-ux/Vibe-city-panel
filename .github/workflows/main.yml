name: Crear APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Compilar APK
        run: |
          if [ -f gradlew ]; then
            chmod +x gradlew
            ./gradlew assembleDebug
          else
            echo "Falta el archivo gradlew en la raiz del repositorio"
            exit 1
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: VibeCityPanel-APK
          path: app/build/outputs/apk/debug/*.apk
